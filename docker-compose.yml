services:
  site:
    image: nginx:alpine
    container_name: riddhi-sidhi-lab-site
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - the-perfect-mart_default

networks:
  the-perfect-mart_default:
    external: true
